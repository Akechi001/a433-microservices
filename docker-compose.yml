version: "2"  # Use Docker Compose version 2

services:
  item-app:
    image: akechi001/item-app:v1  # Replace with your Docker Hub or GitHub Packages image
#    image: ghcr.io/Akechi001/item-app:v1  # Use image from GitHub Container Registry
    depends_on:
      - item-db  # Ensure item-db starts before item-app
    ports:
      - "80"  #  host port 80
    restart: always  # Restart policy to always restart the container
  item-db:
    image: mongo:3  # Use MongoDB version 3
    restart: always  # Always restart the container if it stops
    volumes:
      - app-db:/data/db  # Use a named volume mounted to MongoDB's data directory


# Define named volumes used by the services
volumes:
  app-db:
